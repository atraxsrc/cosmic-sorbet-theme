# Sorbet for lazygit, part of cosmic-sorbet-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/sorbet.yml and
# zsh/sorbet.zsh sets LG_CONFIG_FILE to "config.yml,sorbet.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/sorbet.yml"
gui:
  theme:
    activeBorderColor:
      - "#B2FFF3"
      - bold
    inactiveBorderColor:
      - "#5E616C"
    searchingActiveBorderColor:
      - "#FFC79B"
      - bold
    optionsTextColor:
      - "#DFBAFF"
    selectedLineBgColor:
      - "#1A1727"
    inactiveViewSelectedLineBgColor:
      - "#121019"
    cherryPickedCommitFgColor:
      - "#05080A"
    cherryPickedCommitBgColor:
      - "#FFF6C3"
    markedBaseCommitFgColor:
      - "#05080A"
    markedBaseCommitBgColor:
      - "#BAF7B5"
    unstagedChangesColor:
      - "#FF9FBC"
    defaultFgColor:
      - "#FFF6FF"
  authorColors:
    "*": "#FFF6C3"
