# Sorbet colour scheme for qt5ct / qt6ct, part of cosmic-sorbet-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Sorbet, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#fff6ff, #121019, #5e616c, #28213a, #020304, #1a1727, #fff6ff, #ffffff, #fff6ff, #020304, #05080a, #020304, #b2fff3, #05080a, #b2fff3, #b2fff3, #121019, #05080a, #121019, #fff6ff, #8a8d97
disabled_colors=#5e616c, #121019, #5e616c, #28213a, #020304, #1a1727, #5e616c, #dfbaff, #5e616c, #05080a, #05080a, #020304, #5e616c, #dfbaff, #8a8d97, #8a8d97, #121019, #05080a, #121019, #fff6ff, #5e616c
inactive_colors=#fff6ff, #121019, #5e616c, #28213a, #020304, #1a1727, #fff6ff, #ffffff, #fff6ff, #020304, #05080a, #020304, #b2fff3, #05080a, #b2fff3, #b2fff3, #121019, #05080a, #121019, #fff6ff, #8a8d97
