# Sorbet for kitty, part of cosmic-sorbet-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Sorbet.conf

foreground              #FFF6FF
background              #05080A
selection_foreground    none
selection_background    #28213A

cursor                  #B2FFF3
cursor_text_color       #05080A

url_color               #FFF6C3
url_style               curly

active_border_color     #B2FFF3
inactive_border_color   #5E616C
bell_border_color       #FFC79B

active_tab_foreground   #05080A
active_tab_background   #B2FFF3
inactive_tab_foreground #DFBAFF
inactive_tab_background #121019
tab_bar_background      #05080A

mark1_foreground        #05080A
mark1_background        #BAF7B5
mark2_foreground        #05080A
mark2_background        #FFF6C3
mark3_foreground        #05080A
mark3_background        #FFC79B

# black
color0  #020304
color8  #5E616C
# red
color1  #FF9FBC
color9  #FFC8D8
# green
color2  #BAF7B5
color10 #D8FAD5
